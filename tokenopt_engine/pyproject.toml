[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenopt-engine"
version = "1.3.0"
description = "Dependency-light safe token optimization framework for LLM calls"
requires-python = ">=3.9"
authors = [{name="TokenOpt Engine"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["tokenopt*"]
